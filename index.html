<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Worker"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.json"><title>Worker — Мессенджер</title><style>
:root{--accent:#2563eb;--bg:#f0f3f8;--panel:#fff;--ink:#182335;--muted:#7e8a9d;--line:#e7ebf2;--bubble:#e3edff;--hover:#f0f4fb}body.dark{--bg:#101923;--panel:#172331;--ink:#ecf3fc;--muted:#98aabd;--line:#2a3b4e;--bubble:#294467;--hover:#223448}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}input,textarea,select{color:var(--ink)}.app{height:100dvh;display:grid;grid-template-columns:370px minmax(0,1fr);max-width:1500px;margin:auto;background:var(--panel);box-shadow:0 0 35px #0000000c}.left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.lefthead{padding:18px 16px 10px}.row{display:flex;align-items:center;gap:11px}.brand{font-size:23px;font-weight:800;letter-spacing:-.8px;flex:1}.brand i{font-style:normal;color:var(--accent)}.icon{display:grid;place-items:center;min-width:39px;height:39px;border-radius:50%;font-size:21px}.icon:hover,.listitem:hover,.tab:hover{background:var(--hover)}.search{background:var(--hover);border:1px solid var(--line);border-radius:22px;padding:12px 15px;width:100%;outline:none;margin:14px 0 5px}.tabs{display:flex;border-bottom:1px solid var(--line);overflow:auto}.tab{padding:13px 15px;white-space:nowrap;font-weight:650;color:var(--muted);border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.items{overflow-y:auto;flex:1}.listitem{display:flex;align-items:center;gap:12px;padding:12px 17px;width:100%;text-align:left;border-bottom:1px solid var(--line)}.listitem.active{background:var(--hover)}.avatar{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;flex:none;color:white;font-weight:750;font-size:20px;background:linear-gradient(145deg,#4d9fff,#2452a8);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.itemmain{min-width:0;flex:1}.itemmain strong,.itemmain small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemmain strong{font-size:15px}.itemmain small{color:var(--muted);margin-top:5px}.date{font-size:11px;color:var(--muted)}.badge{display:inline-block;background:var(--accent);color:white;border-radius:15px;min-width:19px;padding:2px 5px;text-align:center;font-size:11px;margin-top:8px}.new{position:absolute;bottom:24px;left:290px;width:55px;height:55px;border-radius:18px;background:var(--accent);color:white;font-size:28px;box-shadow:0 8px 24px #2563eb55}.right{display:flex;flex-direction:column;min-width:0;background:var(--bg)}.chathead{background:var(--panel);height:68px;display:flex;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--line)}.chathead .avatar{width:43px;height:43px;font-size:17px}.chatmeta{flex:1;min-width:0}.chatmeta strong,.chatmeta small{display:block}.chatmeta small{color:var(--muted);margin-top:3px}.messages{flex:1;overflow:auto;padding:20px max(16px,calc((100% - 820px)/2));display:flex;flex-direction:column;gap:10px;background-image:radial-gradient(#7b91b011 1px,transparent 1px);background-size:23px 23px}.msg{align-self:flex-start;background:var(--panel);border-radius:15px 15px 15px 4px;max-width:min(78%,560px);padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 8px #0000000a}.msg.mine{align-self:flex-end;background:var(--bubble);border-radius:15px 15px 4px 15px}.msg small{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:4px}.msg img,.msg video{max-width:100%;max-height:330px;border-radius:10px}.composer{display:flex;align-items:end;gap:9px;background:var(--panel);padding:13px max(15px,calc((100% - 820px)/2));border-top:1px solid var(--line)}.composer textarea{flex:1;border:1px solid var(--line);background:var(--hover);padding:12px;border-radius:18px;resize:none;min-height:43px;max-height:140px;outline:none}.send{width:43px;height:43px;border-radius:50%;background:var(--accent);color:white;font-size:21px}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.empty .symbol{font-size:70px}.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:10;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{width:min(480px,100%);max-height:90dvh;overflow:auto;border-radius:20px;background:var(--panel);padding:22px}.modal h2{margin:0 0 16px}.field{width:100%;border:1px solid var(--line);background:var(--hover);border-radius:12px;padding:12px;margin:7px 0 14px}.primary{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}.full{width:100%}.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.setting label{flex:1}.colors{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.color{width:33px;height:33px;border-radius:50%;border:3px solid transparent}.color.chosen{outline:2px solid var(--ink)}.storybar{display:flex;gap:13px;padding:10px 14px;overflow:auto;border-bottom:1px solid var(--line)}.storyitem{min-width:60px;text-align:center;font-size:11px;color:var(--muted)}.storyitem .avatar{width:54px;height:54px;margin:auto auto 5px;border:3px solid var(--accent)}.storyview{position:fixed;inset:0;background:#080b12;z-index:20;display:none;flex-direction:column;color:white}.storyview.show{display:flex}.progress{height:4px;background:#ffffff55;margin:12px 12px 0;border-radius:4px;overflow:hidden}.progress div{height:100%;width:0;background:white}.storytop{display:flex;align-items:center;gap:12px;padding:12px}.storymedia{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;text-align:center;font-size:26px}.storymedia img,.storymedia video{max-width:100%;max-height:100%;object-fit:contain}.storyfoot{padding:15px;display:flex;gap:10px}.storyfoot input{flex:1;background:#ffffff22;color:white;border:1px solid #ffffff55;border-radius:20px;padding:12px}.storyfoot input::placeholder{color:#ddd}.back{display:none}.hint{font-size:12px;color:var(--muted);line-height:1.5}.muted{color:var(--muted)}@media(max-width:700px){.app{display:block}.left,.right{height:100dvh}.right{display:none}.app.chatopen .left{display:none}.app.chatopen .right{display:flex}.back{display:grid}.new{left:auto;right:22px}.chathead{padding:8px}.messages{padding:14px}.composer{padding:10px}.msg{max-width:86%}} </style></head><body>
<div class="app" id="app"><aside class="left"><div class="lefthead"><div class="row"><button class="icon" onclick="openSettings()" title="Меню">☰</button><div class="brand">Worker<i>.</i></div><button class="icon" onclick="openNotifications()" title="Уведомления">🔔</button><button class="icon" onclick="openSettings()" title="Настройки">⚙</button></div><input id="search" class="search" placeholder="Поиск сообщений, людей, каналов…" oninput="renderList()"></div><div class="storybar" id="stories"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="all">Все</button><button class="tab" data-tab="personal">Личные</button><button class="tab" data-tab="group">Группы</button><button class="tab" data-tab="channel">Каналы</button></div><div class="items" id="items"></div><button class="new" onclick="openCreate()" title="Новый чат">✎</button></aside><section class="right" id="right"><div id="welcome" class="empty"><div class="symbol">✈</div><h2>Worker Messenger</h2><p>Выберите чат, чтобы начать общение</p><p class="hint">Демонстрационная версия: сообщения сохраняются только на этом устройстве.</p></div><div id="chatUI" style="display:none;flex:1;min-height:0;flex-direction:column"><header class="chathead"><button class="icon back" onclick="back()">‹</button><button class="avatar" id="chatAvatar" onclick="openInfo()">W</button><button class="chatmeta" onclick="openInfo()" style="text-align:left"><strong id="chatTitle"></strong><small id="chatSub"></small></button><button class="icon" onclick="openInfo()">⋮</button></header><div class="messages" id="messages"></div><form class="composer" onsubmit="sendMessage(event)"><button type="button" class="icon" onclick="document.getElementById('attachment').click()" title="Прикрепить">📎</button><input id="attachment" type="file" hidden accept="image/*,video/*" onchange="attachFile(this)"><textarea id="draft" rows="1" placeholder="Сообщение…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage(event)}"></textarea><button class="send" title="Отправить">➤</button></form></div></section></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="storyview" id="storyview"><div class="progress"><div id="storyprogress"></div></div><div class="storytop"><span id="storyauthor" style="flex:1;font-weight:700"></span><button class="icon" onclick="closeStory()">✕</button></div><div class="storymedia" id="storymedia" onclick="toggleStoryPause()"></div><div class="storyfoot"><input id="storyreply" placeholder="Ответить…"><button class="primary" onclick="replyStory()">➤</button></div></div>
<script>
const $=id=>document.getElementById(id),key='worker_telegram_demo_v1',colors={blue:'#2563eb',pink:'#db2777',purple:'#7c3aed',green:'#059669',orange:'#ea580c',teal:'#0891b2'};let state,selected=null,tab='all',storyTimer=null,storyStart=0,storyElapsed=0,storyCurrent=null,storyPaused=false;
function initial(){return{profile:{name:'Мой профиль',username:'@worker_user',bio:'Привет! Я в Worker.'},theme:'blue',dark:false,sound:true,dialogs:[{id:'saved',name:'Избранное',username:'@saved',type:'personal',avatar:'★',messages:[{mine:false,text:'Здесь можно сохранять сообщения, заметки и файлы.',time:'09:00'}],unread:0},{id:'news',name:'Новости Worker',username:'@worker_news',type:'channel',avatar:'W',messages:[{mine:false,text:'Добро пожаловать в Worker! Создавайте чаты, группы и каналы.',time:'09:00'}],unread:1},{id:'friends',name:'Друзья',username:'@friends',type:'group',avatar:'👥',messages:[{mine:false,text:'Групповой чат для общения.',time:'09:00'}],unread:0}],stories:[],notifications:[{text:'Добро пожаловать в Worker!',read:false}]}}
try{state=JSON.parse(localStorage.getItem(key))||initial()}catch{state=initial()}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Память браузера заполнена. Выберите файл меньшего размера.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function theme(){document.documentElement.style.setProperty('--accent',colors[state.theme]||colors.blue);document.body.classList.toggle('dark',!!state.dark);document.querySelector('meta[name="theme-color"]').content=state.dark?'#101923':'#f0f3f8'}theme();
function renderList(){let q=$('search').value.toLowerCase();$('items').innerHTML=state.dialogs.filter(d=>(tab==='all'||d.type===tab)&&(d.name+' '+d.username+' '+d.messages.map(m=>m.text).join(' ')).toLowerCase().includes(q)).map(d=>{let last=d.messages.at(-1)||{};return `<button class="listitem ${selected===d.id?'active':''}" onclick="openChat('${esc(d.id)}')"><div class="avatar">${esc(d.avatar||d.name[0])}</div><div class="itemmain"><strong>${esc(d.name)}</strong><small>${esc(last.text||'Нет сообщений')}</small></div><div style="text-align:right"><span class="date">${esc(last.time||'')}</span><br>${d.unread?`<span class="badge">${d.unread}</span>`:''}</div></button>`}).join('')||'<div class="empty">Ничего не найдено</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()});
function current(){return state.dialogs.find(d=>d.id===selected)}function openChat(id){selected=id;let d=current();if(!d)return;d.unread=0;save();$('app').classList.add('chatopen');$('welcome').style.display='none';$('chatUI').style.display='flex';$('chatTitle').textContent=d.name;$('chatSub').textContent=d.username+' · '+({personal:'личный чат',group:'группа',channel:'канал'}[d.type]);$('chatAvatar').textContent=d.avatar||d.name[0];$('draft').placeholder=d.type==='channel'&&!d.owner?'Только чтение':'Сообщение…';$('draft').disabled=d.type==='channel'&&!d.owner;renderMessages();renderList()}function renderMessages(){let d=current();if(!d)return;$('messages').innerHTML=d.messages.map(m=>`<div class="msg ${m.mine?'mine':''}">${m.media?m.mediaType==='video'?`<video controls src="${m.media}"></video>`:`<img alt="Вложение" src="${m.media}">`:''}${m.text?`<div>${esc(m.text)}</div>`:''}<small>${esc(m.time)} ${m.mine?'✓✓':''}</small></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}function sendMessage(e){e?.preventDefault();let d=current(),t=$('draft').value.trim();if(!d||!t)return;if(d.type==='channel'&&!d.owner)return;d.messages.push({mine:true,text:t,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});$('draft').value='';save();renderMessages();renderList()}function attachFile(input){let f=input.files[0];if(!f||!current())return;if(f.size>1400000){alert('В демо файлы ограничены 1,4 МБ. Для больших файлов нужен сервер.');input.value='';return}let r=new FileReader();r.onload=()=>{current().messages.push({mine:true,text:'',media:r.result,mediaType:f.type.startsWith('video')?'video':'image',time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});save();renderMessages();renderList()};r.readAsDataURL(f);input.value=''}function back(){$('app').classList.remove('chatopen')}function modal(html){$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show')}
function openCreate(){modal(`<h2>Новый чат</h2><label>Название</label><input class="field" id="newName" placeholder="Название или имя"><label>Юзернейм</label><input class="field" id="newUsername" placeholder="username"><label>Тип</label><select class="field" id="newType"><option value="personal">Личный чат</option><option value="group">Группа</option><option value="channel">Канал</option></select><button class="primary full" onclick="createDialog()">Создать</button>`)}function createDialog(){let name=$('newName').value.trim(),username=$('newUsername').value.trim().replace(/^@/,'');if(!name)return alert('Введите название');if(!username)username='chat_'+Date.now().toString().slice(-6);let type=$('newType').value;if(type==='channel'&&state.dialogs.filter(d=>d.type==='channel'&&d.owner).length>=10)return alert('Достигнут лимит каналов (10)');let d={id:'d'+Date.now(),name,username:'@'+username,type,owner:true,avatar:name[0].toUpperCase(),messages:[],unread:0,sound:true,description:''};state.dialogs.unshift(d);save();closeModal();renderList();openChat(d.id)}
function openInfo(){let d=current();if(!d)return;modal(`<h2>${esc(d.name)}</h2><p class="muted">${esc(d.username)} · ${esc(d.type)}</p><p>${esc(d.description||'Описание не указано')}</p><div class="setting"><label>Звук уведомлений</label><input type="checkbox" id="chatSound" ${d.sound!==false?'checked':''} onchange="current().sound=this.checked;save()"></div>${d.owner?`<label>Название</label><input class="field" id="editName" value="${esc(d.name)}"><label>Описание</label><textarea class="field" id="editDescription">${esc(d.description||'')}</textarea><button class="primary" onclick="saveDialogInfo()">Сохранить</button>`:''}<button class="icon" onclick="closeModal()" style="margin-left:auto">✕</button>`)}function saveDialogInfo(){let d=current();if(!d?.owner)return;d.name=$('editName').value.trim()||d.name;d.description=$('editDescription').value;save();closeModal();openChat(d.id)}
function openSettings(){modal(`<h2>Настройки Worker</h2><label>Имя</label><input class="field" id="profileName" value="${esc(state.profile.name)}"><label>Юзернейм</label><input class="field" id="profileUsername" value="${esc(state.profile.username)}"><label>О себе</label><textarea class="field" id="profileBio">${esc(state.profile.bio)}</textarea><h3>Цветовая тема</h3><div class="colors">${Object.entries(colors).map(([n,c])=>`<button class="color ${state.theme===n?'chosen':''}" style="background:${c}" onclick="state.theme='${n}';save();theme();openSettings()" title="${n}"></button>`).join('')}</div><div class="setting"><label>Тёмная тема</label><input type="checkbox" ${state.dark?'checked':''} onchange="state.dark=this.checked;save();theme()"></div><div class="setting"><label>Звук уведомлений</label><input type="checkbox" ${state.sound?'checked':''} onchange="state.sound=this.checked;save()"></div><div class="setting"><label>Уведомления браузера</label><button class="primary" onclick="enableNotifications()">Разрешить</button></div><p class="hint">Push при закрытом приложении требует сервер Web Push. Здесь включается только разрешение браузера.</p><button class="primary full" onclick="saveProfile()">Сохранить профиль</button>`)}function saveProfile(){state.profile={name:$('profileName').value.trim(),username:$('profileUsername').value.trim(),bio:$('profileBio').value};save();closeModal()}async function enableNotifications(){if(!('Notification'in window))return alert('Уведомления недоступны');let p=await Notification.requestPermission();alert(p==='granted'?'Разрешение получено. Для push нужен сервер.':'Уведомления не разрешены')}
function openNotifications(){state.notifications.forEach(n=>n.read=true);save();modal('<h2>Уведомления</h2>'+(state.notifications.map(n=>`<p class="setting">${esc(n.text)}</p>`).join('')||'<p>Нет уведомлений</p>'))}
function renderStories(){$('stories').innerHTML=`<button class="storyitem" onclick="createStoryPrompt()"><div class="avatar">＋</div>История</button>`+state.stories.filter(s=>Date.now()-s.created<86400000).map(s=>`<button class="storyitem" onclick="viewStory('${s.id}')"><div class="avatar">${esc(s.author?.[0]||'Я')}</div>${esc(s.author||'Я')}</button>`).join('')}function createStoryPrompt(){modal('<h2>Новая история</h2><textarea class="field" id="storyText" placeholder="Текст истории"></textarea><input class="field" type="file" id="storyFile" accept="image/*,video/*"><button class="primary full" onclick="addStory()">Опубликовать</button>')}function addStory(){let f=$('storyFile').files[0],t=$('storyText').value.trim();if(!f&&!t)return alert('Добавьте текст или файл');if(f&&f.size>1400000)return alert('Файл слишком большой для локального демо');function finish(media,type){state.stories.push({id:'s'+Date.now(),author:state.profile.name,text:t,media,type,created:Date.now()});save();renderStories();closeModal()}if(f){let r=new FileReader();r.onload=()=>finish(r.result,f.type.startsWith('video')?'video':'image');r.readAsDataURL(f)}else finish(null,null)}function viewStory(id){storyCurrent=state.stories.find(s=>s.id===id);if(!storyCurrent)return;$('storyauthor').textContent=storyCurrent.author;$('storymedia').innerHTML=storyCurrent.media?(storyCurrent.type==='video'?`<video autoplay playsinline controls src="${storyCurrent.media}"></video>`:`<img src="${storyCurrent.media}">`):`<p>${esc(storyCurrent.text)}</p>`;$('storyview').classList.add('show');storyStart=performance.now();storyElapsed=0;storyPaused=false;clearInterval(storyTimer);storyTimer=setInterval(()=>{if(storyPaused)return;let v=$('storymedia').querySelector('video');let duration=v&&Number.isFinite(v.duration)&&v.duration>0?v.duration*1000:5000;let elapsed=storyElapsed+performance.now()-storyStart;$('storyprogress').style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)closeStory()},50)}function toggleStoryPause(){storyPaused=!storyPaused;let v=$('storymedia').querySelector('video');if(storyPaused){storyElapsed+=performance.now()-storyStart;v?.pause()}else{storyStart=performance.now();v?.play()}}function closeStory(){clearInterval(storyTimer);$('storyview').classList.remove('show');$('storymedia').innerHTML=''}function replyStory(){let t=$('storyreply').value.trim();if(!t)return;closeStory();$('storyreply').value='';let d=state.dialogs.find(d=>d.id==='saved');d.messages.push({mine:true,text:'Ответ на историю: '+t,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});save();openChat('saved');alert('Ответ сохранён в «Избранном»: для отправки автору нужен сервер и аккаунты пользователей.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeStory()}});renderList();renderStories();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
