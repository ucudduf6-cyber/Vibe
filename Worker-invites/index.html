er-radius:50%;background:var(--accent);color:white;font-size:21px}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.empty .symbol{font-size:70px}.overlay{position:fixed;inset:0;background:#0008;display:none;z-index:10;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{width:min(480px,100%);max-height:90dvh;overflow:auto;border-radius:20px;background:var(--panel);padding:22px}.modal h2{margin:0 0 16px}.field{width:100%;border:1px solid var(--line);background:var(--hover);border-radius:12px;padding:12px;margin:7px 0 14px}.primary{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}.full{width:100%}.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.setting label{flex:1}.colors{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.color{width:33px;height:33px;border-radius:50%;border:3px solid transparent}.color.chosen{outline:2px solid var(--ink)}.storybar{display:flex;gap:13px;padding:10px 14px;overflow:auto;border-bottom:1px solid var(--line)}.storyitem{min-width:60px;text-align:center;font-size:11px;color:var(--muted)}.storyitem .avatar{width:54px;height:54px;margin:auto auto 5px;border:3px solid var(--accent)}.storyview{position:fixed;inset:0;background:#080b12;z-index:20;display:none;flex-direction:column;color:white}.storyview.show{display:flex}.progress{height:4px;background:#ffffff55;margin:12px 12px 0;border-radius:4px;overflow:hidden}.progress div{height:100%;width:0;background:white}.storytop{display:flex;align-items:center;gap:12px;padding:12px}.storymedia{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;text-align:center;font-size:26px}.storymedia img,.storymedia video{max-width:100%;max-height:100%;object-fit:contain}.storyfoot{padding:15px;display:flex;gap:10px}.storyfoot input{flex:1;background:#ffffff22;color:white;border:1px solid #ffffff55;border-radius:2 <div class="app" id="app"><aside class="left"><div class="lefthead"><div class="row"><button class="icon" onclick="openSettings()" title="Меню">☰</button><div class="brand" aria-label="Worker">W</div><button class="icon" onclick="openCreate()" title="Создать группу или канал">＋</button></div><input id="search" class="search" placeholder="Поиск сообщений, людей, каналов…" oninput="renderList()"></div><div class="storybar" id="stories"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="all">Все</button><button class="tab" data-tab="personal">Личные</button><button class="tab" data-tab="group">Группы</button><button class="tab" data-tab="channel">Каналы</button></div><div class="items" id="items"></div></aside><section class="right" id="right"><div id="welcome" class="empty"><div class="symbol">✈</div><h2>Worker Messenger</h2><p>Выберите чат, чтобы начать общение</p><p class="hint">Демонстрационная версия: сообщения сохраняются только на этом устройстве.</p></div><div id="chatUI" style="display:none;flex:1;min-height:0;flex-direction:column"><header class="chathead"><button class="icon back" onclick="back()">‹</button><button class="avatar" id="chatAvatar" onclick="openInfo()">W</button><button class="chatmeta" onclick="openInfo()" style="text-align:left"><strong id="chatTitle"></strong><small id="chatSub"></small></button><button class="icon" onclick="openInfo()">⋮</button></header><div class="messages" id="messages"></div><form class="composer" onsubmit="sendMessage(event)"><button type="button" class="icon" onclick="document.getElementById('attachment').click()" title="Прикрепить">📎</button><input id="attachment" type="file" hidden accept="image/*,video/*" onchange="attachFile(this)"><textarea id="draft" rows="1" placeholder="Сообщение…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage(event)}"></textarea><button class="send" title="Отправить">➤</button></form></div></section></div>

<script>
window.addEventListener('error',function(e){let box=document.getElementById('workerError');if(!box){box=document.createElement('div');box.id='workerError';box.style='position:fixed;z-index:99999;inset:12px auto auto 12px;max-width:calc(100vw - 24px);padding:16px;border-radius:12px;background:#fff;color:#a11;border:2px solid #d44;font:14px system-ui;box-shadow:0 8px 30px #0003';document.body.appendChild(box)}box.textContent='Ошибка Worker: '+(e.message||'Неизвестная ошибка')+' (строка '+e.lineno+')';});

const $=id=>document.getElementById(id),key='worker_telegram_demo_v1',colors={blue:'#2563eb',pink:'#db2777',purple:'#7c3aed',green:'#059669',orange:'#ea580c',teal:'#0891b2',red:'#dc2626',yellow:'#ca8a04',indigo:'#4f46e5',cyan:'#0e7490',lime:'#65a30d',rose:'#e11d48',slate:'#475569',brown:'#92400e',mint:'#0d9488'};let state,selected=null,tab='all',storyTimer=null,storyStart=0,storyElapsed=0,storyCurrent=null,storyPaused=false;
function initial(){return{profile:{name:'Мой профиль',username:'@worker_user',bio:'Привет! Я в Worker.'},theme:'blue',dark:false,sound:true,dialogs:[{id:'saved',name:'Избранное',username:'@saved',type:'personal',avatar:'★',messages:[{mine:false,text:'Здесь можно сохранять сообщения, заметки и файлы.',time:'09:00'}],unread:0},{id:'news',name:'Новости Worker',username:'@worker_news',type:'channel',avatar:'W',messages:[{mine:false,text:'Добро пожаловать в Worker! Создавайте чаты, группы и каналы.',time:'09:00'}],unread:1},{id:'friends',name:'Друзья',username:'@friends',type:'group',avatar:'👥',messages:[{mine:false,text:'Групповой чат для общения.',time:'09:00'}],unread:0}],stories:[],notifications:[{text:'Добро пожаловать в Worker!',read:false}]}}
try{state=JSON.parse(localStorage.getItem(key))||initial()}catch{state=initial()}// Restore missing fields when an older Worker version has left partial saved data.
if(!state || typeof state!=='object')state=initial();
const defaults=initial();
state.profile={...defaults.profile,...(state.profile&&typeof state.profile==='object'?state.profile:{})};
if(!Array.isArray(state.dialogs))state.dialogs=defaults.dialogs;
state.dialogs=state.dialogs.filter(d=>d&&typeof d==='object').map(d=>({...d,messages:Array.isArray(d.messages)?d.messages:[],name:String(d.name||'Чат'),username:String(d.username||''),type:d.type||'personal'}));
if(!Array.isArray(state.stories))state.stories=[];
if(!Array.isArray(state.notifications))state.notifications=[];
if(!Array.isArray(state.hiddenTabs))state.hiddenTabs=[];if(!colors[state.theme]&&state.theme!=='mono')state.theme='blue';
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Память браузера заполнена. Выберите файл меньшего размера.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function theme(){document.documentElement.style.setProperty('--accent',colors[state.theme]||colors.blue);document.body.classList.toggle('dark',!!state.dark);document.body.classList.toggle('mono',state.theme==='mono');document.querySelector('meta[name="theme-color"]').content=state.dark?'#101923':'#f0f3f8'}theme();
function renderList(){document.querySelectorAll('.tab').forEach(b=>{b.hidden=b.dataset.tab!=='all'&&state.hiddenTabs.includes(b.dataset.tab)});if(tab!=='all'&&state.hiddenTabs.includes(tab))tab='all';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let q=$('search').value.toLowerCase().trim();$('items').innerHTML=state.dialogs.filter(d=>(tab==='all'||d.type===tab)&&(!q || (d.username && d.username!=='@' && (d.name+' '+d.username).toLowerCase().includes(q)) || (!q && d.messages.some(m=>m.text)))).map(d=>{let last=d.messages.at(-1)||{};return `<button class="listitem ${selected===d.id?'active':''}" onclick="openChat('${esc(d.id)}')"><div class="avatar">${d.avatarImage?`<img src="${d.avatarImage}" alt="">`:esc(d.avatar||d.name[0])}</div><div class="itemmain"><strong>${esc(d.name)}</strong><small>${esc(last.text||'Нет сообщений')}</small></div><div style="text-align:right"><span class="date">${esc(last.time||'')}</span><br>${d.unread?`<span class="badge">${d.unread}</span>`:''}</div></button>`}).join('')||'<div class="empty">Ничего не найдено</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()});
function current(){return state.dialogs.find(d=>d.id===selected)}function openChat(id){selected=id;let d=current();if(!d)return;d.unread=0;save();$('app').classList.add('chatopen');$('welcome').style.display='none';$('chatUI').style.display='flex';$('chatTitle').textContent=d.name;$('chatSub').textContent=d.username+' · '+({personal:'личный чат',group:'группа',channel:'канал'}[d.type]);$('chatAvatar').innerHTML=d.avatarImage?`<img src="${d.avatarImage}" alt="">`:esc(d.avatar||d.name[0]);$('messages').style.backgroundImage=d.wallpaper?`url("${d.wallpaper}")`:'';$('messages').style.backgroundColor=d.wallpaperColor||'';$('draft').placeholder=d.type==='channel'&&!d.owner?'Только чтение':'Сообщение…';$('draft').disabled=d.type==='channel'&&!d.owner;renderMessages();renderList()}function renderMessages(){let d=current();if(!d)return;$('messages').innerHTML=d.messages.map((m,i)=>`<div class="msg ${m.mine?'mine':''}">${m.media?m.mediaType==='video'?`<video controls src="${m.media}"></video>`:`<img alt="Вложение" src="${m.media}">`:''}${m.text?`<div>${esc(m.text)}</div>`:''}<small>${esc(m.time)} ${m.mine?'✓✓':''}</small><div class="reactions">${Object.entries(m.reactions||{}).filter(([r,v])=>v).map(([r])=>`<button class="reaction active" onclick="toggleReaction(${i},'${r}')">${r}</button>`).join('')}<button class="reaction" onclick="reactionMenu(${i})" title="Реакция">☺＋</button></div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}function sendMessage(e){e?.preventDefault();let d=current(),t=$('draft').value.trim();if(!d||!t)return;if(d.blocked)return alert('Пользователь заблокирован');if(d.type==='personal'&&d.allowMessages===false)return alert('Пользователь запретил личные сообщения');if(d.type==='channel'&&!d.owner)return;d.messages.push({mine:true,text:t,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});$('draft').value='';save();renderMessages();renderList()}function attachFile(input){let f=input.files[0];if(!f||!current())return;if(f.size>1400000){alert('В демо файлы ограничены 1,4 МБ. Для больших файлов нужен сервер.');input.value='';return}let r=new FileReader();r.onload=()=>{current().messages.push({mine:true,text:'',media:r.result,mediaType:f.type.startsWith('video')?'video':'image',time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});save();renderMessages();renderList()};r.readAsDataURL(f);input.value=''}function back(){$('app').classList.remove('chatopen')}function modal(html){$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show')}
function openCreate(){modal(`<h2>Что создать?</h2><button class="choice" onclick="createForm('group')">👥 Создать группу →</button><button class="choice" onclick="createForm('channel')">📣 Создать канал →</button><button class="primary full" onclick="closeModal()">Отмена</button>`)}
function createForm(type){modal(`<h2>${type==='group'?'Новая группа':'Новый канал'}</h2><div class="avatar-edit" onclick="$('newAvatar').click()"><div class="avatar" id="newAvatarPreview">📷</div></div><input id="newAvatar" type="file" accept="image/*" hidden onchange="previewNewAvatar(this)"><p class="tiny" style="text-align:center">Нажмите на круг, чтобы выбрать фото</p><label>Название</label><input class="field" id="newName" maxlength="70" placeholder="Название"><label>Описание</label><textarea class="field" id="newDescription" placeholder="О чём ${type==='group'?'группа':'канал'}?"></textarea><label>Доступ</label><select class="field" id="newPublic" onchange="$('newUsernameBox').hidden=this.value==='private'"><option value="private">Приватный — только по приглашению</option><option value="public">Публичный — доступен в поиске</option></select><div id="newUsernameBox" hidden><label>Публичный юзернейм</label><input class="field" id="newUsername" placeholder="username"></div><input type="hidden" id="newType" value="${type}"><button class="primary full" onclick="createDialog()">Создать</button><button class="choice" onclick="openCreate()">← Назад</button>`)}
function previewNewAvatar(input){const f=input.files[0];if(!f)return;readSmallImage(f,url=>{$('newAvatarPreview').innerHTML=`<img src="${url}" alt="">`})}
function createDialog(){let name=$('newName').value.trim(),username=$('newUsername').value.trim().replace(/^@/,'');if(!name)return alert('Введите название');if(username&&!/^[a-zA-Z0-9_]{5,32}$/.test(username))return alert('Юзернейм: 5–32 символа, латиница, цифры и _');let isPublic=$('newPublic').value==='public';if(isPublic&&!username)return alert('Для публичного сообщества укажите юзернейм');let checked=checkUsername(isPublic?username:'','new');if(checked===null)return;let type=$('newType').value;if(type==='channel'&&state.dialogs.filter(d=>d.type==='channel'&&d.owner).length>=15)return alert('Достигнут лимит каналов (15)');let d={id:'d'+Date.now(),name,username:checked,type,owner:true,avatar:name[0].toUpperCase(),messages:[],unread:0,sound:true,description:$('newDescription').value.trim(),isPublic,inviteToken:randomInvite(),joinApproval:false,requests:[],members:[],admins:[state.profile.name]};let f=$('newAvatar').files[0];if(f){return readSmallImage(f,url=>{d.avatarImage=url;finishNewDialog(d)})}finishNewDialog(d)}
function finishNewDialog(d){state.dialogs.unshift(d);save();closeModal();renderList();openChat(d.id)}function randomInvite(){const bytes=new Uint8Array(18);crypto.getRandomValues(bytes);return Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('')}
function inviteLink(d){return location.origin+location.pathname+'?invite='+encodeURIComponent(d.inviteToken)}
function copyInvite(){const d=current();if(!d)return;navigator.clipboard?.writeText(inviteLink(d)).then(()=>alert('Ссылка скопирована')).catch(()=>prompt('Скопируйте ссылку:',inviteLink(d)))}

function setApproval(v){let d=current();if(!d?.owner)return;d.joinApproval=v;save()}
function avatarUpload(field){let d=current();if(!d?.owner)return;const f=$('avatarUploadFile');f.onchange=()=>setChatImage(f,field);f.click()}
function openInfo(){let d=current();if(!d)return;let admin=!!d.owner;modal(`${d.coverImage&&d.type==='channel'?`<div class="cover" style="background-image:url('${d.coverImage}')"></div>`:''}<div class="avatar-edit" onclick="${admin?"avatarUpload('avatarImage')":"closeModal()"}"><div class="avatar">${d.avatarImage?`<img src="${d.avatarImage}" alt="Аватар">`:esc(d.avatar||d.name[0])}</div></div><input type="file" id="avatarUploadFile" accept="image/*" hidden><h2 style="text-align:center">${esc(d.name)}</h2><p class="muted" style="text-align:center">${esc(d.username||'Без юзернейма')} · ${d.type==='channel'?'Канал':d.type==='group'?'Группа':'Личный чат'}</p><p>${esc(d.description||'Описание не указано')}</p>${d.type==='personal'?`<div class="setting"><label>Заблокировать пользователя</label><input type="checkbox" ${d.blocked?'checked':''} onchange="setBlocked('${esc(d.id)}',this.checked)"></div>`:''}<h3>Фон переписки</h3><div class="colors">${['#eaf2ff','#f4f4f4','#eaf8ec','#fff1df','#fce7f3','#dbeafe','#202c3c'].map(c=>`<button class="color" style="background:${c}" title="Фон" onclick="setChatColor('${c}')"></button>`).join('')}<button class="color" title="Сбросить" onclick="setChatColor('')">×</button></div><input class="field" type="file" accept="image/*" onchange="setChatImage(this,'wallpaper')"><div class="setting"><label>Звук уведомлений</label><input type="checkbox" ${d.sound!==false?'checked':''} onchange="current().sound=this.checked;save()"></div>${d.type!=='personal'?`<h3>Приглашение</h3><div class="invite-line"><code>${esc(inviteLink(d))}</code><button class="primary" onclick="copyInvite()">Копировать</button></div><p class="tiny">Ссылки в этой версии работают только с данными текущего браузера. Для приглашения людей с других устройств нужен сервер.</p>`:''}${admin?`<h3>Управление ${d.type==='channel'?'каналом':'группой'}</h3><div class="setting"><label>Публичное сообщество</label><input type="checkbox" ${d.isPublic?'checked':''} onchange="setVisibility(this.checked)"></div><div class="setting"><label>Вход только по заявке</label><input type="checkbox" ${d.joinApproval?'checked':''} onchange="setApproval(this.checked)"></div>${d.isPublic?`<label>Юзернейм</label><input class="field" id="editUsername" value="${esc(d.username||'')}" placeholder="username">`:''}${d.type==='channel'?`<label>Обложка канала</label><input class="field" type="file" accept="image/*" onchange="setChatImage(this,'coverImage')">`:''}<label>Разрешённые реакции (до 3)</label><div class="colors">${['👍','❤️','😂','🔥','😮','👏','👎'].map(r=>`<label><input type="checkbox" class="reactionChoice" value="${r}" ${(d.allowedReactions||['👍','❤️','😂']).includes(r)?'checked':''}>${r}</label>`).join('')}</div><button class="primary" onclick="openMembers()">Участники, администраторы и заявки</button><label>Название</label><input class="field" id="editName" value="${esc(d.name)}"><label>Описание</label><textarea class="field" id="editDescription">${esc(d.description||'')}</textarea><button class="primary full" onclick="saveDialogInfo()">Сохранить изменения</button>`:''}<button class="choice" onclick="closeModal()">Закрыть</button>`)}
function saveDialogInfo(){let d=current();if(!d?.owner)return;let u=checkUsername(d.isPublic?($('editUsername')?.value||''):'',d.id);if(d.isPublic&&!u)return alert('У публичного сообщества должен быть юзернейм');if(u===null)return;let rs=[...document.querySelectorAll('.reactionChoice:checked')].map(x=>x.value);if(rs.length>3)return alert('Можно выбрать максимум 3 реакции');d.allowedReactions=rs;d.username=u;d.name=$('editName').value.trim()||d.name;d.description=$('editDescription').value;save();closeModal();openChat(d.id)}
function openSettings(){modal(`<h2>☰ Настройки Worker</h2><label>Имя</label><input class="field" id="profileName" value="${esc(state.profile.name)}"><label>Юзернейм</label><input class="field" id="profileUsername" value="${esc(state.profile.username)}"><label>О себе</label><textarea class="field" id="profileBio">${esc(state.profile.bio)}</textarea><label>Фото профиля — нажмите на кружок</label>${state.profile.coverImage?`<div class='cover' style='background-image:url(${state.profile.coverImage})'></div>`:''}<div class='profile-preview avatar' style='width:90px;height:90px;margin:12px auto;cursor:pointer' onclick="$('profilePhotoInput').click()">${state.profile.avatarImage?`<img src='${state.profile.avatarImage}' alt='Фото профиля'>`:esc(state.profile.name?.[0]||'W')}</div><input class="field" id="profilePhotoInput" type="file" accept="image/*" hidden onchange="readSmallImage(this.files[0],url=>{state.profile.avatarImage=url;save();openSettings()})"><div class="setting"><label>Кто может писать мне (на этом устройстве)</label><input type="checkbox" ${state.profile.allowMessages!==false?'checked':''} onchange="state.profile.allowMessages=this.checked;save()"></div><label>Обложка профиля</label><input class='field' type='file' accept='image/*' onchange="readSmallImage(this.files[0],url=>{state.profile.coverImage=url;save();openSettings()})"><div style='height:65px;border-radius:12px;background:var(--hover);background-size:cover;background-position:center;${state.profile.coverImage?`background-image:url(${state.profile.coverImage})`:''}'></div><button class='primary' onclick='openNotifications()'>🔔 Уведомления</button> <button class='primary' onclick='openBlacklist()'>🚫 Чёрный список</button><h3>Папки чатов</h3><p class='hint'>Папка «Все» обязательна и не удаляется. Остальные можно скрыть или вернуть.</p>${[['personal','Личные'],['group','Группы'],['channel','Каналы']].map(([id,name])=>`<div class='setting'><label>${name}</label><input type='checkbox' ${!state.hiddenTabs.includes(id)?'checked':''} onchange="toggleFolder('${id}',this.checked)"></div>`).join('')}<h3>Как установить Worker</h3><p class='hint'><b>iPhone:</b> откройте Worker в Safari → Поделиться (квадрат со стрелкой) → «На экран Домой» → «Добавить».<br><b>Android:</b> откройте Worker в Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран». Для установки нужен HTTPS.</p><h3>Цветовая тема</h3><div class="colors">${Object.entries({...colors,mono:'#777777'}).map(([n,c])=>`<button class="color ${state.theme===n?'chosen':''}" style="background:${c}" onclick="state.theme='${n}';save();theme();openSettings()" title="${n}"></button>`).join('')}</div><div class="setting"><label>Тёмная тема</label><input type="checkbox" ${state.dark?'checked':''} onchange="state.dark=this.checked;save();theme()"></div><div class="setting"><label>Звук уведомлений</label><input type="checkbox" ${state.sound?'checked':''} onchange="state.sound=this.checked;save()"></div><div class="setting"><label>Уведомления браузера</label><button class="primary" onclick="enableNotifications()">Разрешить</button></div><p class="hint">Push при закрытом приложении требует сервер Web Push. Здесь включается только разрешение браузера.</p><button class="primary full" onclick="saveProfile()">Сохранить профиль</button>`)}function setBlocked(id,blocked){let d=state.dialogs.find(x=>x.id===id);if(!d||d.type!=='personal')return;d.blocked=blocked;save();openInfo()}
function openBlacklist(){modal(`<h2>🚫 Чёрный список</h2>${state.dialogs.filter(d=>d.type==='personal'&&d.blocked).map(d=>`<div class="setting"><span>${esc(d.name)}</span><button class="primary" onclick="setBlockedFromList('${esc(d.id)}')">Разблокировать</button></div>`).join('')||'<p class="muted">Заблокированных нет</p>'}<button class="choice" onclick="openSettings()">← Настройки</button>`)}
function setBlockedFromList(id){let d=state.dialogs.find(x=>x.id===id);if(d)d.blocked=false;save();openBlacklist()}
function handleInvite(){const token=new URLSearchParams(location.search).get('invite');if(!token)return;history.replaceState(null,'',location.pathname+location.hash);let d=state.dialogs.find(x=>x.inviteToken===token);if(!d){alert('Приглашение не найдено на этом устройстве. Для ссылок между пользователями необходим сервер.');return}if(d.joinApproval){d.requests??=[];if(!d.requests.includes(state.profile.name))d.requests.push(state.profile.name);save();alert('Заявка сохранена локально. Для настоящей отправки администратору нужен сервер.')}else{openChat(d.id);alert('Приглашение открыто в локальной версии Worker.')}}
function toggleFolder(id,enabled){if(id==='all')return;state.hiddenTabs=state.hiddenTabs.filter(x=>x!==id);if(!enabled)state.hiddenTabs.push(id);save();renderList()}function setChatColor(color){let d=current();if(!d)return;d.wallpaper='';d.wallpaperColor=color;save();openChat(d.id);openInfo()}function saveProfile(){let u=checkUsername($('profileUsername').value,'profile');if(u===null)return;state.profile={...state.profile,name:$('profileName').value.trim(),username:u,bio:$('profileBio').value};save();closeModal()}async function enableNotifications(){if(!('Notification'in window))return alert('Уведомления недоступны');let p=await Notification.requestPermission();alert(p==='granted'?'Разрешение получено. Для push нужен сервер.':'Уведомления не разрешены')}
function openMembers(){let d=current();if(!d?.owner)return alert('Доступно только администратору');modal(`<h2>Участники · ${esc(d.name)}</h2><h3>Подписчики</h3><p>${(d.members||[]).map(x=>esc(x)).join(', ')||'Нет данных об участниках'}</p><h3>Администраторы</h3><p>${(d.admins||[state.profile.name]).map(x=>esc(x)).join(', ')}</p><h3>Заявки на вступление</h3>${(d.requests||[]).map((x,i)=>`<div class="setting"><span>${esc(x)}</span><button class="primary" onclick="approveRequest(${i})">Принять</button></div>`).join('')||'<p>Заявок нет</p>'}<button class="choice" onclick="openInfo()">Назад</button>`)}
function approveRequest(i){let d=current();if(!d?.owner)return;let [name]=(d.requests||[]).splice(i,1);if(name&&!d.members.includes(name))d.members.push(name);save();openMembers()}
function checkUsername(value,except){let u=value.trim().replace(/^@/,'').toLowerCase();if(!u)return '';if(!/^[a-z0-9_]{5,32}$/.test(u)){alert('Юзернейм: 5–32 символа, латиница, цифры и _');return null}let names=[...state.dialogs.filter(d=>d.id!==except).map(d=>d.username||''),...(except==='profile'?[]:[state.profile.username||''])].map(x=>x.replace(/^@/,'').toLowerCase()).filter(Boolean);if(names.some(x=>x===u||x.includes(u)||u.includes(x))){alert('Такой или слишком похожий юзернейм уже используется на этом устройстве');return null}return '@'+u}function openNotifications(){state.notifications.forEach(n=>n.read=true);save();modal('<h2>Уведомления</h2>'+(state.notifications.map(n=>`<p class="setting">${esc(n.text)}</p>`).join('')||'<p>Нет уведомлений</p>'))}
function readSmallImage(file,cb){if(!file)return;if(!file.type.startsWith('image/'))return alert('Выберите изображение');if(file.size>650000)return alert('Изображение должно быть меньше 650 КБ (локальное хранение)');let reader=new FileReader();reader.onload=()=>cb(reader.result);reader.readAsDataURL(file)}
function setChatImage(input,field){let d=current();if(!d)return;readSmallImage(input.files[0],url=>{d[field]=url;save();openChat(d.id);openInfo()})}
function toggleReaction(i,r){let m=current()?.messages[i];if(!m)return;if(!(current()?.allowedReactions||['👍','❤️','😂']).includes(r))return;m.reactions??={};m.reactions[r]=!m.reactions[r];save();renderMessages()}
function reactionMenu(i){modal('<h2>Реакция на сообщение</h2><div class="colors">'+(current()?.allowedReactions||['👍','❤️','😂']).map(r=>`<button class="icon" onclick="closeModal();toggleReaction(${i},'${r}')">${r}</button>`).join('')+'</div><button class="primary" onclick="closeModal()">Закрыть</button>')}
function renderStories(){$('stories').innerHTML=`<button class="storyitem" onclick="createStoryPrompt()"><div class="avatar">＋</div>История</button>`+state.stories.filter(s=>Date.now()-s.created<86400000).map(s=>`<button class="storyitem" onclick="viewStory('${s.id}')"><div class="avatar">${esc(s.author?.[0]||'Я')}</div>${esc(s.author||'Я')}</button>`).join('')}function createStoryPrompt(){modal('<h2>Новая история</h2><textarea class="field" id="storyText" placeholder="Текст истории"></textarea><input class="field" type="file" id="storyFile" accept="image/*,video/*"><button class="primary full" onclick="addStory()">Опубликовать</button>')}function addStory(){let f=$('storyFile').files[0],t=$('storyText').value.trim();if(!f&&!t)return alert('Добавьте текст или файл');if(f&&f.size>1400000)return alert('Файл слишком большой для локального демо');function finish(media,type){state.stories.push({id:'s'+Date.now(),author:state.profile.name,text:t,media,type,created:Date.now()});save();renderStories();closeModal()}if(f){let r=new FileReader();r.onload=()=>finish(r.result,f.type.startsWith('video')?'video':'image');r.readAsDataURL(f)}else finish(null,null)}function viewStory(id){storyCurrent=state.stories.find(s=>s.id===id);if(!storyCurrent)return;$('storyauthor').textContent=storyCurrent.author;$('storymedia').innerHTML=storyCurrent.media?(storyCurrent.type==='video'?`<video autoplay playsinline controls src="${storyCurrent.media}"></video>`:`<img src="${storyCurrent.media}">`):`<p>${esc(storyCurrent.text)}</p>`;$('storyview').classList.add('show');storyStart=performance.now();storyElapsed=0;storyPaused=false;clearInterval(storyTimer);storyTimer=setInterval(()=>{if(storyPaused)return;let v=$('storymedia').querySelector('video');let duration=v&&Number.isFinite(v.duration)&&v.duration>0?v.duration*1000:5000;let elapsed=storyElapsed+performance.now()-storyStart;$('storyprogress').style.width=Math.min(100,elapsed/duration*100)+'%';if(elapsed>=duration)closeStory()},50)}function toggleStoryPause(){storyPaused=!storyPaused;let v=$('storymedia').querySelector('video');if(storyPaused){storyElapsed+=performance.now()-storyStart;v?.pause()}else{storyStart=performance.now();v?.play()}}function closeStory(){clearInterval(storyTimer);$('storyview').classList.remove('show');$('storymedia').innerHTML=''}function replyStory(){let t=$('storyreply').value.trim();if(!t)return;closeStory();$('storyreply').value='';let d=state.dialogs.find(d=>d.id==='saved');d.messages.push({mine:true,text:'Ответ на историю: '+t,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});save();openChat('saved');alert('Ответ сохранён в «Избранном»: для отправки автору нужен сервер и аккаунты пользователей.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeStory()}});renderList();renderStories();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

handleInvite();
</script></body></html>
